<!DOCTYPE html>
<html lang="tr">
<head>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28 select-none">

  <!-- Top Header Banner -->

    <div class="max-w-md mx-auto">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-500 to-red-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-white font-black text-2xl tracking-tighter">
            🍝
          </div>
          <div>
            <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-1.5">
              MAKARNA EVİ

              Taze Makarna & Lezzet Durağı
            </p>
          </div>
        </div>

        <div id="table-badge-container" class="hidden bg-amber-500/20 border border-amber-500/40 rounded-xl px-3 py-1.5 text-right shadow-sm">

          <span id="table-badge-text" class="text-sm font-black text-amber-400"></span>
        </div>
      </div>

      
    </div>
  </header>

  <!-- Sticky Search & Categories -->
  <div class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md border-b border-slate-800/80 shadow-md">
    <div class="max-w-md mx-auto px-4 py-2.5 space-y-2">
      <!-- Search Input -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
        <input
          id="search-input"
          type="text"
          placeholder="Yemek veya içecek ara..."
          class="w-full pl-9 pr-8 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-colors"
        />
        <button id="search-clear" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">✕</button>
      </div>

      <!-- Category Filter Buttons -->
      <div id="category-pills" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <!-- Menu Products List -->
  <main id="menu-container" class="max-w-md mx-auto px-4 mt-4 space-y-6">
    <!-- Injected via JS -->
  </main>

  <!-- Bottom Floating Summary & Actions -->
  <aside class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800/90 px-4 py-3 shadow-2xl">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="text-xs">
        <span class="text-slate-400 block">Sipariş Taslağınız:</span>
        <span id="cart-summary" class="text-base font-black text-amber-400">0.00 TL (0 Ürün)</span>
      </div>
      <button 
        id="btn-open-cart"
        class="py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-xs shadow-lg shadow-orange-500/20 active:scale-95 transition-all"
      >
        Sepeti İncele 🛒
      </button>
    </div>
  </aside>

  <!-- Cart Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-5 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="font-black text-white text-base">🛒 Sipariş Taslağınız</h3>
        <button id="btn-close-cart" class="text-slate-400 hover:text-white p-1 font-bold">✕</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto py-3 space-y-2">
        <!-- Injected via JS -->
      </div>
      <div class="pt-3 border-t border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-slate-400 text-sm">Tahmini Tutar:</span>
          <span id="cart-modal-total" class="text-xl font-black text-amber-400">0.00 TL</span>
        </div>

          💡 Bu liste telefonunuzda kayıtlı kalır. Garsonunuz masanıza geldiğinde siparişinizi hızlıca iletebilirsiniz.
        </div>
        <button id="btn-clear-cart" class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:text-red-400 transition-colors">
          Listeyi Temizle
        </button>
      </div>
    </div>
  </div>

","price":100,"vat_rate":10,"description":"Yoğun süt köpüğü ve espresso uyumu","is_active":1,"image_url":"https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80","calories":"~110 kcal"},{"id":209,"category_id":9,"name":"Türk Kahvesi","price":100,"vat_rate":10,"description":"Bol köpüklü geleneksel Türk kahvesi, lokum ve su ile","is_active":1,"image_url":"https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80","calories":"~20 kcal"},{"id":210,"category_id":9,"name":"Sıcak Çikolata","price":100,"vat_rate":10,"description":"Yoğun çikolata lezzeti ve sıcak süt","is_active":1,"image_url":"https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=600&q=80","calories":"~250 kcal"},{"id":211,"category_id":9,"name":"Soğuk Kahve Çeşitleri (Iced Latte / Iced Americano)","price":100,"vat_rate":10,"description":"Buz gibi ferahlatıcı espresso lezzeti","is_active":1,"image_url":"https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600&q=80","calories":"~120 kcal"},{"id":212,"category_id":9,"name":"Salep (Tarçın eşliğinde)","price":150,"vat_rate":10,"description":"Taze sütle pişirilmiş hakiki orkide salebi ve tarçın","is_active":1,"image_url":"https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=600&q=80","calories":"~220 kcal"},{"id":213,"category_id":9,"name":"Atom (Özel karışım vitamin & enerji içeceği)","price":200,"vat_rate":10,"description":"Taze süt, bal, muz ve fındık/ceviz vitamin bombası","is_active":1,"image_url":"https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80","calories":"~280 kcal"}]}];
    let activeCategory = 'all';
    let searchQuery = '';
    let cart = {};

    // Check table from URL
    const urlParams = new URLSearchParams(window.location.search);
    const tableParam = urlParams.get('table') || urlParams.get('masa');
    if (tableParam) {
      document.getElementById('table-badge-container').classList.remove('hidden');
      document.getElementById('table-badge-text').innerText = tableParam;
    }

    // Render Categories
    function renderCategories() {
      const container = document.getElementById('category-pills');
      let html = `
        <button onclick="setCategory('all')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeCategory === 'all' ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
          ✨ Tüm Menü
        </button>
      `;

      MENU_DATA.forEach(cat => {
        const isSel = String(activeCategory) === String(cat.id);
        html += `
          <button onclick="setCategory('${cat.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${isSel ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 border border-slate-800'}">
            <span>${cat.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full ${isSel ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-slate-400'}">${cat.products ? cat.products.length : 0}</span>
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function setCategory(catId) {
      activeCategory = catId;
      renderCategories();
      renderMenu();
    }

    // Render Menu Products
    function renderMenu() {
      const container = document.getElementById('menu-container');
      let filtered = MENU_DATA;

      if (activeCategory !== 'all') {
        filtered = filtered.filter(c => String(c.id) === String(activeCategory));
      }

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.map(c => ({
          ...c,
          products: (c.products || []).filter(p => p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)))
        })).filter(c => c.products && c.products.length > 0);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800/60 p-6">
            <p class="text-3xl mb-2">🍽️</p>
            <h3 class="text-sm font-bold text-slate-300">Aradığınız ürün bulunamadı</h3>
            <p class="text-xs text-slate-500 mt-1">Farklı bir kelime deneyebilirsiniz.</p>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(cat => {
        html += `
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-extrabold text-white tracking-tight flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                ${cat.name}
              </h2>
              <span class="text-xs text-slate-500 font-medium">${cat.products ? cat.products.length : 0} çeşit</span>
            </div>
            ${cat.description ? `
              <p class="text-[11px] text-amber-300 font-semibold bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-xl flex items-center gap-2">
                <span>✨</span> <span>${cat.description}</span>
              </p>
            ` : ''}

            <div class="grid grid-cols-1 gap-2.5">
        `;

        (cat.products || []).forEach(p => {
          const inCart = cart[p.id] ? cart[p.id].qty : 0;
          html += `
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-3.5 flex gap-3.5 shadow-sm">
              ${p.image_url ? `
                <img src="${p.image_url}" alt="${p.name}" class="w-20 h-20 rounded-xl object-cover border border-slate-800 shrink-0" loading="lazy" />
              ` : `
                <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-800 flex items-center justify-center shrink-0 text-2xl">
                  🍽️
                </div>
              `}

              <div class="flex-1 flex flex-col justify-between min-w-0">
                <div>
                  <div class="flex items-start justify-between gap-1.5">
                    <h3 class="text-sm font-bold text-white leading-snug">${p.name}</h3>
                    ${p.calories ? `
                      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/25 shrink-0 whitespace-nowrap shadow-sm">
                        🔥 ${p.calories}
                      </span>
                    ` : ''}
                  </div>
                  ${p.description ? `<p class="text-xs text-slate-400 mt-1 line-clamp-2 leading-relaxed">${p.description}</p>` : ''}
                </div>

                <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/50">
                  <span class="text-base font-black text-amber-400">
                    ${Number(p.price).toFixed(2)} <span class="text-xs font-bold text-amber-500">TL</span>
                  </span>

                  <div class="flex items-center gap-1.5">
                    ${inCart > 0 ? `
                      <button onclick="changeQty(${p.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 font-bold flex items-center justify-center hover:bg-slate-700">-</button>
                      <span class="text-xs font-bold text-white w-4 text-center">${inCart}</span>
                    ` : ''}
                    <button onclick="changeQty(${p.id}, 1)" class="px-2.5 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs flex items-center gap-1 hover:bg-amber-400 active:scale-95 shadow-sm shadow-amber-500/20">
                      <span>+</span> <span>${inCart > 0 ? 'Ekle' : 'Seç'}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        html += `</div></section>`;
      });

      html += `
        <div class="pt-6 pb-4 text-center border-t border-slate-900 mt-6 space-y-1">
          <p class="text-xs text-slate-400 font-medium flex items-center justify-center gap-1.5">
            <span>ℹ️</span>
            <span>Kalori değerleri ortalama standart porsiyonlara göre hesaplanmıştır.</span>
          </p>
          <p class="text-[10px] text-slate-600">Makarna Evi • Afiyet Olsun</p>
        </div>
      `;

      container.innerHTML = html;
    }

    function changeQty(prodId, delta) {
      // Find product
      let prod = null;
      for (const c of MENU_DATA) {
        for (const p of (c.products || [])) {
          if (p.id === prodId) { prod = p; break; }
        }
        if (prod) break;
      }
      if (!prod) return;

      const current = cart[prodId] ? cart[prodId].qty : 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[prodId];
      } else {
        cart[prodId] = { prod, qty: next };
      }

      updateCartUI();
      renderMenu();
    }

    function updateCartUI() {
      const items = Object.values(cart);
      const count = items.reduce((acc, it) => acc + it.qty, 0);
      const total = items.reduce((acc, it) => acc + (it.qty * it.prod.price), 0);

      document.getElementById('cart-summary').innerText = `${total.toFixed(2)} TL (${count} Ürün)`;
      document.getElementById('cart-modal-total').innerText = `${total.toFixed(2)} TL`;

      // Modal items
      const container = document.getElementById('cart-items');
      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Sepetiniz boş.</p>';
        return;
      }

      let html = '';
      items.forEach(it => {
        html += `
          <div class="flex items-center justify-between bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
            <div class="min-w-0 pr-2">
              <h4 class="text-xs font-bold text-white truncate">${it.prod.name}</h4>
              <span class="text-[11px] text-amber-400 font-bold">${it.prod.price} TL x ${it.qty} = ${(it.prod.price * it.qty).toFixed(2)} TL</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="changeQty(${it.prod.id}, -1)" class="w-6 h-6 rounded bg-slate-800 text-slate-300 font-bold">-</button>
              <span class="text-xs font-bold text-white w-4 text-center">${it.qty}</span>
              <button onclick="changeQty(${it.prod.id}, 1)" class="w-6 h-6 rounded bg-amber-500 text-slate-950 font-bold">+</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Search events
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClear.classList.toggle('hidden', !searchQuery);
      renderMenu();
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.classList.add('hidden');
      renderMenu();
    });

    // Cart Modal events
    document.getElementById('btn-open-cart').addEventListener('click', () => {
      document.getElementById('cart-modal').classList.remove('hidden');
    });
    document.getElementById('btn-close-cart').addEventListener('click', () => {
      document.getElementById('cart-modal').classList.add('hidden');
    });
    document.getElementById('btn-clear-cart').addEventListener('click', () => {
      cart = {};
      updateCartUI();
      renderMenu();
      document.getElementById('cart-modal').classList.add('hidden');
    });

    // Initialize
    renderCategories();
    renderMenu();
    updateCartUI();
  </script>
</body>
</html>
